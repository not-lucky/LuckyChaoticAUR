name: Build AUR Packages

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      packages: ${{ steps.check.outputs.packages_to_build }}
      build_needed: ${{ steps.check.outputs.build_needed }}
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed git sudo curl jq

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check which packages need to be built
        id: check
        run: |
          chmod +x scripts/check_packages.sh
          ./scripts/check_packages.sh "${{ github.repository }}" "repository" >> $GITHUB_OUTPUT

  build:
    needs: setup
    if: needs.setup.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    strategy:
      matrix:
        package: ${{ fromJSON(needs.setup.outputs.packages) }}
      fail-fast: false
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed git sudo curl

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure pacman (multilib & custom repo)
        run: |
          # Enable multilib if disabled
          sed -i '/\[multilib\]/,/Include/ s/^#//' /etc/pacman.conf

          # Configure custom repo from GitHub Releases to resolve in-repo dependencies
          cat << 'EOF' >> /etc/pacman.conf

          [lucky-chaotic]
          SigLevel = Optional TrustAll
          Server = https://github.com/${{ github.repository }}/releases/download/repository
          EOF

      - name: Build package
        run: |
          pkg="${{ matrix.package }}"
          echo "Building package: $pkg"
          
          # Setup builder user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          # Determine package directory
          pkg_dir="/tmp/build-$pkg"
          mkdir -p "$pkg_dir"
          
          # Locate local package directory or clone from AUR
          if [ -d "$pkg" ] && [ -f "$pkg/PKGBUILD" ]; then
            echo "Using local package directory: $pkg"
            cp -a "$pkg/." "$pkg_dir/"
          elif [ -d "packages/$pkg" ] && [ -f "packages/$pkg/PKGBUILD" ]; then
            echo "Using local package directory: packages/$pkg"
            cp -a "packages/$pkg/." "$pkg_dir/"
          elif [ -d "pkgs/$pkg" ] && [ -f "pkgs/$pkg/PKGBUILD" ]; then
            echo "Using local package directory: pkgs/$pkg"
            cp -a "pkgs/$pkg/." "$pkg_dir/"
          else
            echo "Cloning from AUR..."
            git clone "https://aur.archlinux.org/${pkg}.git" "$pkg_dir"
          fi
          
          chown -R builder:builder "$pkg_dir"
          cd "$pkg_dir"
          
          # Import GPG keys if specified in PKGBUILD/.SRCINFO
          if [ -f .SRCINFO ]; then
            gpg_keys=$(grep -E '^\s*validpgpkeys\s*=' .SRCINFO | cut -d'=' -f2 | tr -d '[:blank:]' | tr -d "'" | tr -d '"')
            for key in $gpg_keys; do
              if [ -n "$key" ]; then
                echo "Importing PGP key: $key"
                sudo -u builder gpg --recv-keys "$key" || \
                sudo -u builder gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys "$key" || \
                echo "Failed to import key $key"
              fi
            done
          fi
          
          # Update package databases
          pacman -Sy
          
          # Build package using makepkg (installs dependencies via pacman)
          sudo -u builder makepkg --syncdeps --noconfirm --noprogressbar
          
          # Copy built package files to staging, sanitizing any colons in filenames
          mkdir -p /tmp/built-packages
          for f in *.pkg.tar.zst; do
            if [ -f "$f" ]; then
              clean_name=$(echo "$f" | tr ':' '.')
              cp "$f" "/tmp/built-packages/$clean_name"
            fi
          done

      - name: Archive Package Artifacts
        run: |
          tar -cvf "/tmp/${{ matrix.package }}.tar" -C /tmp/built-packages .

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts-${{ matrix.package }}
          path: /tmp/${{ matrix.package }}.tar

  publish:
    needs: [setup, build]
    if: needs.setup.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed git sudo curl github-cli

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/new-packages
          merge-multiple: true

      - name: Extract Package Artifacts
        run: |
          cd /tmp/new-packages
          for f in *.tar; do
            if [ -f "$f" ]; then
              tar -xvf "$f"
              rm "$f"
            fi
          done

      - name: Update repository and database
        run: |
          chmod +x scripts/update_repository.sh
          ./scripts/update_repository.sh "${{ github.repository }}" "repository" "${{ secrets.GITHUB_TOKEN }}"
